<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sayfa Bulunamadı - Sanu Temizlik</title>
  <meta name="description" content="Aradığınız sayfa bulunamadı. Sanu Temizlik ana sayfasına dönebilirsiniz.">
  <meta name="robots" content="noindex, follow">
  
  <link rel="icon" href="/assets/img/sanu-temizlik-logo.png">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Outfit', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen text-slate-800 antialiased selection:bg-sky-200 selection:text-sky-900">

  <!-- Header -->
  <header class="bg-white/90 sticky top-0 z-50 w-full border-b border-slate-200 backdrop-blur-md">
    <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
      <a href="/" class="flex items-center gap-3">
        <img src="/assets/img/sanu-temizlik-logo.png" alt="Sanu Temizlik ve Ticaret Ltd. logosu" class="h-12 w-auto">
      </a>
      <a href="/" class="text-sm font-bold text-sky-600 hover:text-sky-700">Ana Sayfaya Dön</a>
    </div>
  </header>

  <!-- Main 404 Content -->
  <main class="flex-grow flex items-center justify-center py-20 px-4">
    <div class="max-w-2xl text-center">
      
      <!-- Icon/Illustration -->
      <div class="mb-8 flex justify-center">
        <div class="relative h-40 w-40 rounded-full bg-sky-100 flex items-center justify-center">
          <i data-lucide="spray-can" class="h-20 w-20 text-sky-600"></i>
          <!-- Small sparkles -->
          <i data-lucide="sparkles" class="absolute -top-2 -right-2 h-8 w-8 text-yellow-400"></i>
          <i data-lucide="sparkle" class="absolute bottom-2 -left-2 h-6 w-6 text-yellow-400"></i>
        </div>
      </div>

      <h1 class="text-6xl font-black text-slate-900 tracking-tight sm:text-8xl">404</h1>
      <h2 class="mt-4 text-2xl font-bold text-slate-800 sm:text-3xl">Pırıl pırıl temizledik ama...</h2>
      <p class="mt-4 text-lg text-slate-600">
        Görünüşe göre aradığınız sayfa da temizliğe kurban gitmiş ya da yer değiştirmiş. Endişelenmeyin, en taze ve temiz sayfalarımıza geri dönebilirsiniz.
      </p>

      <div class="mt-10 flex flex-col sm:flex-row justify-center gap-4">
        <a href="/" class="inline-flex items-center justify-center gap-2 rounded-lg bg-sky-600 px-6 py-3 text-sm font-bold text-white transition-colors hover:bg-sky-700">
          <i data-lucide="home" class="h-5 w-5"></i>
          Ana Sayfaya Dön
        </a>
        <a href="http://wa.me/+905338828989" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center gap-2 rounded-lg bg-green-500 px-6 py-3 text-sm font-bold text-white transition-colors hover:bg-green-600">
          <i data-lucide="message-circle" class="h-5 w-5"></i>
          WhatsApp'tan Ulaşın
        </a>
      </div>
    </div>
  </main>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
