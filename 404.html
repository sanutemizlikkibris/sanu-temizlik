<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa Bulunamadı | Sanu Temizlik</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 300: '#7dd3fc', 400: '#38bdf8', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985', 900: '#0c4a6e', 950: '#082f49' },
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script defer src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-slate-50 flex flex-col min-h-screen">
  <header class="surface sticky top-0 z-50 border-b border-slate-200">
    <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-4 lg:px-8">
      <a href="/" class="flex items-center gap-2" aria-label="Ana Sayfa">
        <img src="/assets/img/sanu_temizlik_logo.jpg" alt="" class="h-8 w-auto mix-blend-multiply" aria-hidden="true">
        <span class="text-xl font-black tracking-tight text-brand-900">Sanu Temizlik</span>
      </a>
      <div class="flex items-center gap-4">
        <a href="/" class="btn-primary flex items-center gap-2">
          <i data-lucide="home" class="h-4 w-4"></i><span class="hidden sm:inline">Ana Sayfaya Dön</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center py-20 px-4">
    <div class="text-center">
      <i data-lucide="file-question" class="h-24 w-24 mx-auto text-brand-300 mb-6"></i>
      <h1 class="text-6xl font-black text-slate-900 mb-4">404</h1>
      <h2 class="text-2xl font-bold text-slate-700 mb-6">Aradığınız Sayfa Bulunamadı</h2>
      <p class="text-slate-600 mb-8 max-w-md mx-auto">Görünüşe göre ulaşmaya çalıştığınız sayfa taşınmış veya silinmiş olabilir. Endişelenmeyin, ana sayfamıza dönerek hizmetlerimizi inceleyebilirsiniz.</p>
      <a href="/" class="btn-primary inline-flex items-center gap-2 text-lg px-8 py-3">
        Ana Sayfaya Dön
      </a>
    </div>
  </main>

  <footer class="bg-brand-900 py-12 text-sky-50 mt-auto">
    <div class="mx-auto max-w-7xl px-4 lg:px-8 text-center">
      <p class="text-sm opacity-70">© 2026 Sanu Temizlik ve Ticaret Ltd. Tüm hakları saklıdır.</p>
    </div>
  </footer>
  <script>lucide.createIcons();</script>
</body>
</html>
